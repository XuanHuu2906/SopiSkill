# Polyglot SopiSkill Stack (Phase 1+ clean-slate infrastructure — separate ports & volumes
# from legacy root docker-compose.yml so legacy DB/volumes remain 100% untouched).
#
# Phase 1 services:
#   - pgvector-db (pgvector/pgvector:pg16, schema `rag` owned by ai-engine Alembic)
#   - redis (redis:7-alpine, Streams broker for `queue:ai:llm` and `queue:ai:ingest`)
#   - minio (pgsty/minio:latest, object storage for source PDFs & media)
#   - ai-api, ai-worker-llm, ai-worker-ingest (3 workloads sharing 1 image `sopiskill-ai-py:local`)

services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POLYGLOT_PG_USER:-sopiskill}
      POSTGRES_PASSWORD: ${POLYGLOT_PG_PASSWORD:-sopiskill_password}
      POSTGRES_DB: ${POLYGLOT_PG_DB:-sopiskill}
    ports:
      - "127.0.0.1:${POLYGLOT_PG_PORT:-5439}:5432"
    volumes:
      - sopiskill_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POLYGLOT_PG_USER:-sopiskill} -d ${POLYGLOT_PG_DB:-sopiskill}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${POLYGLOT_REDIS_PORT:-6380}:6379"
    volumes:
      - sopiskill_polyglot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${POLYGLOT_MINIO_USER:-sopiskill_minio}
      MINIO_ROOT_PASSWORD: ${POLYGLOT_MINIO_PASSWORD:-sopiskill_minio_password}
    ports:
      - "127.0.0.1:${POLYGLOT_MINIO_PORT:-9010}:9000"
      - "127.0.0.1:${POLYGLOT_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - sopiskill_polyglot_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-api:
    image: sopiskill-ai-py:local
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &ai_common_env
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POLYGLOT_PG_USER:-sopiskill}:${POLYGLOT_PG_PASSWORD:-sopiskill_password}@pgvector-db:5432/${POLYGLOT_PG_DB:-sopiskill}
      REDIS_URL: redis://redis:6379/0
      CORE_API_URL: ${CORE_API_URL:-http://core-api:8080}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:-dev-internal-hmac-secret-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-256}
      SOURCE_STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${POLYGLOT_MINIO_USER:-sopiskill_minio}
      S3_SECRET_KEY: ${POLYGLOT_MINIO_PASSWORD:-sopiskill_minio_password}
      S3_BUCKET: ${S3_BUCKET:-sopiskill-sources}
      WEB_INGEST_ENABLED: ${WEB_INGEST_ENABLED:-false}
      OCR_ENABLED: ${OCR_ENABLED:-false}
    ports:
      # Internal-only binding on host loopback; never expose publicly in production (ClusterIP in K8s).
      - "127.0.0.1:${AI_API_PORT:-8010}:8000"
    depends_on:
      pgvector-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-worker-llm:
    image: sopiskill-ai-py:local
    command: ["python", "-m", "app.workers.worker_llm"]
    environment: *ai_common_env
    depends_on:
      ai-api:
        condition: service_healthy

  ai-worker-ingest:
    image: sopiskill-ai-py:local
    command: ["python", "-m", "app.workers.worker_ingest"]
    environment: *ai_common_env
    depends_on:
      ai-api:
        condition: service_healthy

volumes:
  sopiskill_pgvector_data:
  sopiskill_polyglot_redis:
  sopiskill_polyglot_minio:
