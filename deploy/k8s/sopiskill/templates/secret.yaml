{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sopiskill.fullname" . }}-secrets
  labels:
    {{- include "sopiskill.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://%s:%d/%s?currentSchema=core" (include "sopiskill.pgHost" .) (int .Values.pgvector.port) .Values.secrets.postgresDb | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.secrets.postgresUser | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword (include "sopiskill.pgHost" .) (int .Values.pgvector.port) .Values.secrets.postgresDb | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  LESSON_SHUFFLE_SECRET: {{ .Values.secrets.lessonShuffleSecret | quote }}
  INTERNAL_SERVICE_TOKEN: {{ .Values.secrets.internalServiceToken | quote }}
  INTERNAL_HMAC_SECRET: {{ .Values.secrets.internalHmacSecret | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioSecretKey | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  EMBEDDING_API_KEY: {{ .Values.secrets.embeddingApiKey | quote }}
  TTS_API_KEY: {{ .Values.secrets.ttsApiKey | quote }}
{{- end }}
