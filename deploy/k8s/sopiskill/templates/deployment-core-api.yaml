apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sopiskill.fullname" . }}-core-api
  labels:
    {{- include "sopiskill.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  replicas: {{ .Values.coreApi.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: core-api
  template:
    metadata:
      labels:
        {{- include "sopiskill.labels" . | nindent 8 }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: core-api
    spec:
      terminationGracePeriodSeconds: {{ .Values.coreApi.terminationGracePeriodSeconds }}
      containers:
        - name: core-api
          image: {{ printf "%s:%s" .Values.images.coreApi.repository .Values.images.coreApi.tag | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.coreApi.port }}
          envFrom:
            - configMapRef:
                name: {{ include "sopiskill.fullname" . }}-config
            - secretRef:
                name: {{ include "sopiskill.secretName" . }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.coreApi.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.coreApi.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 3"]
          resources:
            {{- toYaml .Values.coreApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sopiskill.fullname" . }}-core-api
  labels:
    {{- include "sopiskill.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: core-api
  ports:
    - name: http
      port: {{ .Values.coreApi.port }}
      targetPort: {{ .Values.coreApi.port }}
