services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ailp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailp_password}
      POSTGRES_DB: ${POSTGRES_DB:-ailp}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # P4.0 — private object storage cho PDF nguồn. Không expose console/API ra ngoài
  # mạng tin cậy; chỉ backend/worker/beat truy cập qua mạng compose.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sopiskill_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sopiskill_minio_password}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailp}:${POSTGRES_PASSWORD:-ailp_password}@db:5432/${POSTGRES_DB:-ailp}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_SCHEMA_RETRIES: ${LLM_MAX_SCHEMA_RETRIES:-1}
      LLM_MAX_OUTPUT_TOKENS_INTERVIEW: ${LLM_MAX_OUTPUT_TOKENS_INTERVIEW:-800}
      LLM_MAX_OUTPUT_TOKENS_PROPOSAL: ${LLM_MAX_OUTPUT_TOKENS_PROPOSAL:-4500}
      LLM_MAX_OUTPUT_TOKENS_LESSON: ${LLM_MAX_OUTPUT_TOKENS_LESSON:-3000}
      LLM_MAX_OUTPUT_TOKENS_JUDGE: ${LLM_MAX_OUTPUT_TOKENS_JUDGE:-3000}
      LLM_PRICING_JSON: ${LLM_PRICING_JSON:-}
      GENERATION_MAX_TOKENS_PER_JOB: ${GENERATION_MAX_TOKENS_PER_JOB:-400000}
      GENERATION_MAX_COST_USD_PER_JOB: ${GENERATION_MAX_COST_USD_PER_JOB:-0}
      # P3.0 — Source Registry (cả 3 service dùng chung cấu hình)
      SOURCE_DISCOVERY_ADAPTER: ${SOURCE_DISCOVERY_ADAPTER:-curated}
      SOURCE_CURATED_CATALOG: ${SOURCE_CURATED_CATALOG:-}
      SOURCE_CONTEXT_ENABLED: ${SOURCE_CONTEXT_ENABLED:-true}
      SOURCE_CONTEXT_MAX_CHARS: ${SOURCE_CONTEXT_MAX_CHARS:-0}
      SOURCE_RESEARCH_ENABLED: ${SOURCE_RESEARCH_ENABLED:-false}
      SOURCE_RESEARCH_PROVIDER: ${SOURCE_RESEARCH_PROVIDER:-mock}
      SOURCE_RESEARCH_MAX_SOURCES: ${SOURCE_RESEARCH_MAX_SOURCES:-8}
      SOURCE_RESEARCH_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TIMEOUT_SECONDS:-15}
      SOURCE_RESEARCH_MAX_TOOL_CALLS: ${SOURCE_RESEARCH_MAX_TOOL_CALLS:-12}
      SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS:-5}
      SOURCE_RESEARCH_AUTO_LINK: ${SOURCE_RESEARCH_AUTO_LINK:-false}
      # P3.0 — AI Tutor (cả 3 service dùng chung cấu hình)
      TUTOR_ENABLED: ${TUTOR_ENABLED:-false}
      TUTOR_HISTORY_MAX_MESSAGES: ${TUTOR_HISTORY_MAX_MESSAGES:-12}
      TUTOR_MAX_QUESTION_CHARS: ${TUTOR_MAX_QUESTION_CHARS:-2000}
      TUTOR_CONTEXT_MAX_CHARS: ${TUTOR_CONTEXT_MAX_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS_TUTOR: ${LLM_MAX_OUTPUT_TOKENS_TUTOR:-900}
      TUTOR_STREAM_TIMEOUT_SECONDS: ${TUTOR_STREAM_TIMEOUT_SECONDS:-60}
      TUTOR_HEARTBEAT_SECONDS: ${TUTOR_HEARTBEAT_SECONDS:-15}
      TUTOR_MESSAGES_PER_DAY: ${TUTOR_MESSAGES_PER_DAY:-0}
      TUTOR_TOKENS_PER_DAY: ${TUTOR_TOKENS_PER_DAY:-0}
      TUTOR_MAX_CONCURRENT_STREAMS: ${TUTOR_MAX_CONCURRENT_STREAMS:-2}
      TUTOR_STALE_STREAM_SECONDS: ${TUTOR_STALE_STREAM_SECONDS:-180}
      TUTOR_CANCEL_POLL_SECONDS: ${TUTOR_CANCEL_POLL_SECONDS:-1}
      TUTOR_TOOLS_ENABLED: ${TUTOR_TOOLS_ENABLED:-false}
      TUTOR_TOOL_MAX_CALLS: ${TUTOR_TOOL_MAX_CALLS:-2}
      TUTOR_TOOL_TIMEOUT_SECONDS: ${TUTOR_TOOL_TIMEOUT_SECONDS:-3}
      TUTOR_TOOL_MAX_RESULT_CHARS: ${TUTOR_TOOL_MAX_RESULT_CHARS:-3000}
      # P4.0 — PDF ingest + private object storage (MinIO). Endpoint dùng DNS nội bộ
      # compose; KHÔNG đưa access/secret key vào NEXT_PUBLIC_* hay bundle frontend.
      SOURCE_INGEST_ENABLED: ${SOURCE_INGEST_ENABLED:-true}
      SOURCE_MAX_PDF_BYTES: ${SOURCE_MAX_PDF_BYTES:-20971520}
      SOURCE_MAX_PDF_PAGES: ${SOURCE_MAX_PDF_PAGES:-300}
      SOURCE_EXTRACT_TIMEOUT_SECONDS: ${SOURCE_EXTRACT_TIMEOUT_SECONDS:-120}
      SOURCE_CHUNK_TARGET_CHARS: ${SOURCE_CHUNK_TARGET_CHARS:-1000}
      SOURCE_CHUNK_MIN_CHARS: ${SOURCE_CHUNK_MIN_CHARS:-200}
      SOURCE_PIPELINE_VERSION: ${SOURCE_PIPELINE_VERSION:-p4.0-v1}
      SOURCE_INGEST_LEASE_SECONDS: ${SOURCE_INGEST_LEASE_SECONDS:-300}
      SOURCE_INGEST_MAX_ATTEMPTS: ${SOURCE_INGEST_MAX_ATTEMPTS:-3}
      # P4.2 — web/arXiv ingest (mặc định TẮT + allowlist rỗng)
      WEB_INGEST_ENABLED: ${WEB_INGEST_ENABLED:-false}
      WEB_INGEST_ALLOWED_HOSTS: ${WEB_INGEST_ALLOWED_HOSTS:-}
      WEB_INGEST_REQUIRE_HTTPS: ${WEB_INGEST_REQUIRE_HTTPS:-true}
      WEB_MAX_FETCH_BYTES: ${WEB_MAX_FETCH_BYTES:-5242880}
      WEB_FETCH_TIMEOUT_SECONDS: ${WEB_FETCH_TIMEOUT_SECONDS:-20}
      WEB_FETCH_CONNECT_TIMEOUT_SECONDS: ${WEB_FETCH_CONNECT_TIMEOUT_SECONDS:-5}
      WEB_MAX_REDIRECTS: ${WEB_MAX_REDIRECTS:-3}
      WEB_MAX_EXTRACTED_CHARS: ${WEB_MAX_EXTRACTED_CHARS:-2000000}
      WEB_INGEST_RESPECT_ROBOTS: ${WEB_INGEST_RESPECT_ROBOTS:-true}
      WEB_ROBOTS_MAX_BYTES: ${WEB_ROBOTS_MAX_BYTES:-65536}
      WEB_ROBOTS_CACHE_SECONDS: ${WEB_ROBOTS_CACHE_SECONDS:-3600}
      WEB_ROBOTS_TIMEOUT_SECONDS: ${WEB_ROBOTS_TIMEOUT_SECONDS:-5}
      WEB_INGEST_USER_AGENT: ${WEB_INGEST_USER_AGENT:-SopiSkillBot/1.0 (+source-ingest)}
      WEB_PIPELINE_VERSION: ${WEB_PIPELINE_VERSION:-p4.2-v1}
      ARXIV_METADATA_SOURCE: ${ARXIV_METADATA_SOURCE:-abs}
      # P4.3 — OCR cho PDF scan (mặc định TẮT; cần requirements-ocr.txt trong image)
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
      OCR_LANG: ${OCR_LANG:-vi}
      OCR_MODEL_VERSION: ${OCR_MODEL_VERSION:-}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      OCR_DPI: ${OCR_DPI:-200}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-300}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.0}
      OCR_VIETOCR_WEIGHTS: ${OCR_VIETOCR_WEIGHTS:-}
      OCR_VIETOCR_CONFIG: ${OCR_VIETOCR_CONFIG:-}
      ARXIV_API_HOST: ${ARXIV_API_HOST:-export.arxiv.org}
      ARXIV_PDF_HOST: ${ARXIV_PDF_HOST:-arxiv.org}
      SOURCE_STORAGE_BACKEND: ${SOURCE_STORAGE_BACKEND:-s3}
      SOURCE_STORAGE_BUCKET: ${SOURCE_STORAGE_BUCKET:-sopiskill-sources}
      # Endpoint nội bộ compose luôn là DNS service `minio:9000`. Chạy backend
      # trên host thì dùng SOURCE_STORAGE_ENDPOINT=localhost:9000 trong .env.
      SOURCE_STORAGE_ENDPOINT: minio:9000
      SOURCE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-sopiskill_minio}
      SOURCE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sopiskill_minio_password}
      SOURCE_STORAGE_SECURE: ${SOURCE_STORAGE_SECURE:-false}
      SOURCE_STORAGE_REGION: ${SOURCE_STORAGE_REGION:-us-east-1}
      SOURCE_STORAGE_AUTO_CREATE_BUCKET: ${SOURCE_STORAGE_AUTO_CREATE_BUCKET:-true}
      # P4.1 — Embedding + Hybrid RAG. `hashing` không network/không model;
      # `openai_compatible` cần EMBEDDING_BASE_URL/API_KEY và KHÔNG fallback.
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-ngram-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-256}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-2000}
      RAG_MIN_LEXICAL_SCORE: ${RAG_MIN_LEXICAL_SCORE:-0.40}
      RAG_VECTOR_ONLY_MIN_SIMILARITY: ${RAG_VECTOR_ONLY_MIN_SIMILARITY:-0.40}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (copy .env.example)}
      ALLOW_DEMO_HEADER: ${ALLOW_DEMO_HEADER:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Có broker Redis → không chạy generation inline trong process API.
      GENERATION_ALLOW_INLINE_FALLBACK: "false"
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailp}:${POSTGRES_PASSWORD:-ailp_password}@db:5432/${POSTGRES_DB:-ailp}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_SCHEMA_RETRIES: ${LLM_MAX_SCHEMA_RETRIES:-1}
      LLM_MAX_OUTPUT_TOKENS_INTERVIEW: ${LLM_MAX_OUTPUT_TOKENS_INTERVIEW:-800}
      LLM_MAX_OUTPUT_TOKENS_PROPOSAL: ${LLM_MAX_OUTPUT_TOKENS_PROPOSAL:-4500}
      LLM_MAX_OUTPUT_TOKENS_LESSON: ${LLM_MAX_OUTPUT_TOKENS_LESSON:-3000}
      LLM_MAX_OUTPUT_TOKENS_JUDGE: ${LLM_MAX_OUTPUT_TOKENS_JUDGE:-3000}
      LLM_PRICING_JSON: ${LLM_PRICING_JSON:-}
      GENERATION_MAX_TOKENS_PER_JOB: ${GENERATION_MAX_TOKENS_PER_JOB:-400000}
      GENERATION_MAX_COST_USD_PER_JOB: ${GENERATION_MAX_COST_USD_PER_JOB:-0}
      # P3.0 — Source Registry (cả 3 service dùng chung cấu hình)
      SOURCE_DISCOVERY_ADAPTER: ${SOURCE_DISCOVERY_ADAPTER:-curated}
      SOURCE_CURATED_CATALOG: ${SOURCE_CURATED_CATALOG:-}
      SOURCE_CONTEXT_ENABLED: ${SOURCE_CONTEXT_ENABLED:-true}
      SOURCE_CONTEXT_MAX_CHARS: ${SOURCE_CONTEXT_MAX_CHARS:-0}
      SOURCE_RESEARCH_ENABLED: ${SOURCE_RESEARCH_ENABLED:-false}
      SOURCE_RESEARCH_PROVIDER: ${SOURCE_RESEARCH_PROVIDER:-mock}
      SOURCE_RESEARCH_MAX_SOURCES: ${SOURCE_RESEARCH_MAX_SOURCES:-8}
      SOURCE_RESEARCH_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TIMEOUT_SECONDS:-15}
      SOURCE_RESEARCH_MAX_TOOL_CALLS: ${SOURCE_RESEARCH_MAX_TOOL_CALLS:-12}
      SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS:-5}
      SOURCE_RESEARCH_AUTO_LINK: ${SOURCE_RESEARCH_AUTO_LINK:-false}
      # P3.0 — AI Tutor (cả 3 service dùng chung cấu hình)
      TUTOR_ENABLED: ${TUTOR_ENABLED:-false}
      TUTOR_HISTORY_MAX_MESSAGES: ${TUTOR_HISTORY_MAX_MESSAGES:-12}
      TUTOR_MAX_QUESTION_CHARS: ${TUTOR_MAX_QUESTION_CHARS:-2000}
      TUTOR_CONTEXT_MAX_CHARS: ${TUTOR_CONTEXT_MAX_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS_TUTOR: ${LLM_MAX_OUTPUT_TOKENS_TUTOR:-900}
      TUTOR_STREAM_TIMEOUT_SECONDS: ${TUTOR_STREAM_TIMEOUT_SECONDS:-60}
      TUTOR_HEARTBEAT_SECONDS: ${TUTOR_HEARTBEAT_SECONDS:-15}
      TUTOR_MESSAGES_PER_DAY: ${TUTOR_MESSAGES_PER_DAY:-0}
      TUTOR_TOKENS_PER_DAY: ${TUTOR_TOKENS_PER_DAY:-0}
      TUTOR_MAX_CONCURRENT_STREAMS: ${TUTOR_MAX_CONCURRENT_STREAMS:-2}
      TUTOR_STALE_STREAM_SECONDS: ${TUTOR_STALE_STREAM_SECONDS:-180}
      TUTOR_CANCEL_POLL_SECONDS: ${TUTOR_CANCEL_POLL_SECONDS:-1}
      TUTOR_TOOLS_ENABLED: ${TUTOR_TOOLS_ENABLED:-false}
      TUTOR_TOOL_MAX_CALLS: ${TUTOR_TOOL_MAX_CALLS:-2}
      TUTOR_TOOL_TIMEOUT_SECONDS: ${TUTOR_TOOL_TIMEOUT_SECONDS:-3}
      TUTOR_TOOL_MAX_RESULT_CHARS: ${TUTOR_TOOL_MAX_RESULT_CHARS:-3000}
      # P4.0 — PDF ingest + private object storage (MinIO). Endpoint dùng DNS nội bộ
      # compose; KHÔNG đưa access/secret key vào NEXT_PUBLIC_* hay bundle frontend.
      SOURCE_INGEST_ENABLED: ${SOURCE_INGEST_ENABLED:-true}
      SOURCE_MAX_PDF_BYTES: ${SOURCE_MAX_PDF_BYTES:-20971520}
      SOURCE_MAX_PDF_PAGES: ${SOURCE_MAX_PDF_PAGES:-300}
      SOURCE_EXTRACT_TIMEOUT_SECONDS: ${SOURCE_EXTRACT_TIMEOUT_SECONDS:-120}
      SOURCE_CHUNK_TARGET_CHARS: ${SOURCE_CHUNK_TARGET_CHARS:-1000}
      SOURCE_CHUNK_MIN_CHARS: ${SOURCE_CHUNK_MIN_CHARS:-200}
      SOURCE_PIPELINE_VERSION: ${SOURCE_PIPELINE_VERSION:-p4.0-v1}
      SOURCE_INGEST_LEASE_SECONDS: ${SOURCE_INGEST_LEASE_SECONDS:-300}
      SOURCE_INGEST_MAX_ATTEMPTS: ${SOURCE_INGEST_MAX_ATTEMPTS:-3}
      # P4.2 — web/arXiv ingest (mặc định TẮT + allowlist rỗng)
      WEB_INGEST_ENABLED: ${WEB_INGEST_ENABLED:-false}
      WEB_INGEST_ALLOWED_HOSTS: ${WEB_INGEST_ALLOWED_HOSTS:-}
      WEB_INGEST_REQUIRE_HTTPS: ${WEB_INGEST_REQUIRE_HTTPS:-true}
      WEB_MAX_FETCH_BYTES: ${WEB_MAX_FETCH_BYTES:-5242880}
      WEB_FETCH_TIMEOUT_SECONDS: ${WEB_FETCH_TIMEOUT_SECONDS:-20}
      WEB_FETCH_CONNECT_TIMEOUT_SECONDS: ${WEB_FETCH_CONNECT_TIMEOUT_SECONDS:-5}
      WEB_MAX_REDIRECTS: ${WEB_MAX_REDIRECTS:-3}
      WEB_MAX_EXTRACTED_CHARS: ${WEB_MAX_EXTRACTED_CHARS:-2000000}
      WEB_INGEST_RESPECT_ROBOTS: ${WEB_INGEST_RESPECT_ROBOTS:-true}
      WEB_ROBOTS_MAX_BYTES: ${WEB_ROBOTS_MAX_BYTES:-65536}
      WEB_ROBOTS_CACHE_SECONDS: ${WEB_ROBOTS_CACHE_SECONDS:-3600}
      WEB_ROBOTS_TIMEOUT_SECONDS: ${WEB_ROBOTS_TIMEOUT_SECONDS:-5}
      WEB_INGEST_USER_AGENT: ${WEB_INGEST_USER_AGENT:-SopiSkillBot/1.0 (+source-ingest)}
      WEB_PIPELINE_VERSION: ${WEB_PIPELINE_VERSION:-p4.2-v1}
      ARXIV_METADATA_SOURCE: ${ARXIV_METADATA_SOURCE:-abs}
      # P4.3 — OCR cho PDF scan (mặc định TẮT; cần requirements-ocr.txt trong image)
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
      OCR_LANG: ${OCR_LANG:-vi}
      OCR_MODEL_VERSION: ${OCR_MODEL_VERSION:-}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      OCR_DPI: ${OCR_DPI:-200}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-300}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.0}
      OCR_VIETOCR_WEIGHTS: ${OCR_VIETOCR_WEIGHTS:-}
      OCR_VIETOCR_CONFIG: ${OCR_VIETOCR_CONFIG:-}
      ARXIV_API_HOST: ${ARXIV_API_HOST:-export.arxiv.org}
      ARXIV_PDF_HOST: ${ARXIV_PDF_HOST:-arxiv.org}
      SOURCE_STORAGE_BACKEND: ${SOURCE_STORAGE_BACKEND:-s3}
      SOURCE_STORAGE_BUCKET: ${SOURCE_STORAGE_BUCKET:-sopiskill-sources}
      # Endpoint nội bộ compose luôn là DNS service `minio:9000`. Chạy backend
      # trên host thì dùng SOURCE_STORAGE_ENDPOINT=localhost:9000 trong .env.
      SOURCE_STORAGE_ENDPOINT: minio:9000
      SOURCE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-sopiskill_minio}
      SOURCE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sopiskill_minio_password}
      SOURCE_STORAGE_SECURE: ${SOURCE_STORAGE_SECURE:-false}
      SOURCE_STORAGE_REGION: ${SOURCE_STORAGE_REGION:-us-east-1}
      SOURCE_STORAGE_AUTO_CREATE_BUCKET: ${SOURCE_STORAGE_AUTO_CREATE_BUCKET:-true}
      # P4.1 — Embedding + Hybrid RAG. `hashing` không network/không model;
      # `openai_compatible` cần EMBEDDING_BASE_URL/API_KEY và KHÔNG fallback.
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-ngram-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-256}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-2000}
      RAG_MIN_LEXICAL_SCORE: ${RAG_MIN_LEXICAL_SCORE:-0.40}
      RAG_VECTOR_ONLY_MIN_SIMILARITY: ${RAG_VECTOR_ONLY_MIN_SIMILARITY:-0.40}
      # Worker thật: không fallback chạy generation inline trong request API.
      GENERATION_ALLOW_INLINE_FALLBACK: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Reconciler/outbox: gửi lại job kẹt queued + requeue job có lease hết hạn.
  beat:
    build: ./backend
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailp}:${POSTGRES_PASSWORD:-ailp_password}@db:5432/${POSTGRES_DB:-ailp}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_SCHEMA_RETRIES: ${LLM_MAX_SCHEMA_RETRIES:-1}
      LLM_MAX_OUTPUT_TOKENS_INTERVIEW: ${LLM_MAX_OUTPUT_TOKENS_INTERVIEW:-800}
      LLM_MAX_OUTPUT_TOKENS_PROPOSAL: ${LLM_MAX_OUTPUT_TOKENS_PROPOSAL:-4500}
      LLM_MAX_OUTPUT_TOKENS_LESSON: ${LLM_MAX_OUTPUT_TOKENS_LESSON:-3000}
      LLM_MAX_OUTPUT_TOKENS_JUDGE: ${LLM_MAX_OUTPUT_TOKENS_JUDGE:-3000}
      LLM_PRICING_JSON: ${LLM_PRICING_JSON:-}
      GENERATION_MAX_TOKENS_PER_JOB: ${GENERATION_MAX_TOKENS_PER_JOB:-400000}
      GENERATION_MAX_COST_USD_PER_JOB: ${GENERATION_MAX_COST_USD_PER_JOB:-0}
      # P3.0 — Source Registry (cả 3 service dùng chung cấu hình)
      SOURCE_DISCOVERY_ADAPTER: ${SOURCE_DISCOVERY_ADAPTER:-curated}
      SOURCE_CURATED_CATALOG: ${SOURCE_CURATED_CATALOG:-}
      SOURCE_CONTEXT_ENABLED: ${SOURCE_CONTEXT_ENABLED:-true}
      SOURCE_CONTEXT_MAX_CHARS: ${SOURCE_CONTEXT_MAX_CHARS:-0}
      SOURCE_RESEARCH_ENABLED: ${SOURCE_RESEARCH_ENABLED:-false}
      SOURCE_RESEARCH_PROVIDER: ${SOURCE_RESEARCH_PROVIDER:-mock}
      SOURCE_RESEARCH_MAX_SOURCES: ${SOURCE_RESEARCH_MAX_SOURCES:-8}
      SOURCE_RESEARCH_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TIMEOUT_SECONDS:-15}
      SOURCE_RESEARCH_MAX_TOOL_CALLS: ${SOURCE_RESEARCH_MAX_TOOL_CALLS:-12}
      SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS:-5}
      SOURCE_RESEARCH_AUTO_LINK: ${SOURCE_RESEARCH_AUTO_LINK:-false}
      # P3.0 — AI Tutor (cả 3 service dùng chung cấu hình)
      TUTOR_ENABLED: ${TUTOR_ENABLED:-false}
      TUTOR_HISTORY_MAX_MESSAGES: ${TUTOR_HISTORY_MAX_MESSAGES:-12}
      TUTOR_MAX_QUESTION_CHARS: ${TUTOR_MAX_QUESTION_CHARS:-2000}
      TUTOR_CONTEXT_MAX_CHARS: ${TUTOR_CONTEXT_MAX_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS_TUTOR: ${LLM_MAX_OUTPUT_TOKENS_TUTOR:-900}
      TUTOR_STREAM_TIMEOUT_SECONDS: ${TUTOR_STREAM_TIMEOUT_SECONDS:-60}
      TUTOR_HEARTBEAT_SECONDS: ${TUTOR_HEARTBEAT_SECONDS:-15}
      TUTOR_MESSAGES_PER_DAY: ${TUTOR_MESSAGES_PER_DAY:-0}
      TUTOR_TOKENS_PER_DAY: ${TUTOR_TOKENS_PER_DAY:-0}
      TUTOR_MAX_CONCURRENT_STREAMS: ${TUTOR_MAX_CONCURRENT_STREAMS:-2}
      TUTOR_STALE_STREAM_SECONDS: ${TUTOR_STALE_STREAM_SECONDS:-180}
      TUTOR_CANCEL_POLL_SECONDS: ${TUTOR_CANCEL_POLL_SECONDS:-1}
      TUTOR_TOOLS_ENABLED: ${TUTOR_TOOLS_ENABLED:-false}
      TUTOR_TOOL_MAX_CALLS: ${TUTOR_TOOL_MAX_CALLS:-2}
      TUTOR_TOOL_TIMEOUT_SECONDS: ${TUTOR_TOOL_TIMEOUT_SECONDS:-3}
      TUTOR_TOOL_MAX_RESULT_CHARS: ${TUTOR_TOOL_MAX_RESULT_CHARS:-3000}
      # P4.0 — PDF ingest + private object storage (MinIO). Endpoint dùng DNS nội bộ
      # compose; KHÔNG đưa access/secret key vào NEXT_PUBLIC_* hay bundle frontend.
      SOURCE_INGEST_ENABLED: ${SOURCE_INGEST_ENABLED:-true}
      SOURCE_MAX_PDF_BYTES: ${SOURCE_MAX_PDF_BYTES:-20971520}
      SOURCE_MAX_PDF_PAGES: ${SOURCE_MAX_PDF_PAGES:-300}
      SOURCE_EXTRACT_TIMEOUT_SECONDS: ${SOURCE_EXTRACT_TIMEOUT_SECONDS:-120}
      SOURCE_CHUNK_TARGET_CHARS: ${SOURCE_CHUNK_TARGET_CHARS:-1000}
      SOURCE_CHUNK_MIN_CHARS: ${SOURCE_CHUNK_MIN_CHARS:-200}
      SOURCE_PIPELINE_VERSION: ${SOURCE_PIPELINE_VERSION:-p4.0-v1}
      SOURCE_INGEST_LEASE_SECONDS: ${SOURCE_INGEST_LEASE_SECONDS:-300}
      SOURCE_INGEST_MAX_ATTEMPTS: ${SOURCE_INGEST_MAX_ATTEMPTS:-3}
      # P4.2 — web/arXiv ingest (mặc định TẮT + allowlist rỗng)
      WEB_INGEST_ENABLED: ${WEB_INGEST_ENABLED:-false}
      WEB_INGEST_ALLOWED_HOSTS: ${WEB_INGEST_ALLOWED_HOSTS:-}
      WEB_INGEST_REQUIRE_HTTPS: ${WEB_INGEST_REQUIRE_HTTPS:-true}
      WEB_MAX_FETCH_BYTES: ${WEB_MAX_FETCH_BYTES:-5242880}
      WEB_FETCH_TIMEOUT_SECONDS: ${WEB_FETCH_TIMEOUT_SECONDS:-20}
      WEB_FETCH_CONNECT_TIMEOUT_SECONDS: ${WEB_FETCH_CONNECT_TIMEOUT_SECONDS:-5}
      WEB_MAX_REDIRECTS: ${WEB_MAX_REDIRECTS:-3}
      WEB_MAX_EXTRACTED_CHARS: ${WEB_MAX_EXTRACTED_CHARS:-2000000}
      WEB_INGEST_RESPECT_ROBOTS: ${WEB_INGEST_RESPECT_ROBOTS:-true}
      WEB_ROBOTS_MAX_BYTES: ${WEB_ROBOTS_MAX_BYTES:-65536}
      WEB_ROBOTS_CACHE_SECONDS: ${WEB_ROBOTS_CACHE_SECONDS:-3600}
      WEB_ROBOTS_TIMEOUT_SECONDS: ${WEB_ROBOTS_TIMEOUT_SECONDS:-5}
      WEB_INGEST_USER_AGENT: ${WEB_INGEST_USER_AGENT:-SopiSkillBot/1.0 (+source-ingest)}
      WEB_PIPELINE_VERSION: ${WEB_PIPELINE_VERSION:-p4.2-v1}
      ARXIV_METADATA_SOURCE: ${ARXIV_METADATA_SOURCE:-abs}
      # P4.3 — OCR cho PDF scan (mặc định TẮT; cần requirements-ocr.txt trong image)
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
      OCR_LANG: ${OCR_LANG:-vi}
      OCR_MODEL_VERSION: ${OCR_MODEL_VERSION:-}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      OCR_DPI: ${OCR_DPI:-200}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-300}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.0}
      OCR_VIETOCR_WEIGHTS: ${OCR_VIETOCR_WEIGHTS:-}
      OCR_VIETOCR_CONFIG: ${OCR_VIETOCR_CONFIG:-}
      ARXIV_API_HOST: ${ARXIV_API_HOST:-export.arxiv.org}
      ARXIV_PDF_HOST: ${ARXIV_PDF_HOST:-arxiv.org}
      SOURCE_STORAGE_BACKEND: ${SOURCE_STORAGE_BACKEND:-s3}
      SOURCE_STORAGE_BUCKET: ${SOURCE_STORAGE_BUCKET:-sopiskill-sources}
      # Endpoint nội bộ compose luôn là DNS service `minio:9000`. Chạy backend
      # trên host thì dùng SOURCE_STORAGE_ENDPOINT=localhost:9000 trong .env.
      SOURCE_STORAGE_ENDPOINT: minio:9000
      SOURCE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-sopiskill_minio}
      SOURCE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sopiskill_minio_password}
      SOURCE_STORAGE_SECURE: ${SOURCE_STORAGE_SECURE:-false}
      SOURCE_STORAGE_REGION: ${SOURCE_STORAGE_REGION:-us-east-1}
      SOURCE_STORAGE_AUTO_CREATE_BUCKET: ${SOURCE_STORAGE_AUTO_CREATE_BUCKET:-true}
      # P4.1 — Embedding + Hybrid RAG. `hashing` không network/không model;
      # `openai_compatible` cần EMBEDDING_BASE_URL/API_KEY và KHÔNG fallback.
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-ngram-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-256}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-2000}
      RAG_MIN_LEXICAL_SCORE: ${RAG_MIN_LEXICAL_SCORE:-0.40}
      RAG_VECTOR_ONLY_MIN_SIMILARITY: ${RAG_VECTOR_ONLY_MIN_SIMILARITY:-0.40}
      GENERATION_ALLOW_INLINE_FALLBACK: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
