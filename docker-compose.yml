services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ailp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailp_password}
      POSTGRES_DB: ${POSTGRES_DB:-ailp}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailp}:${POSTGRES_PASSWORD:-ailp_password}@db:5432/${POSTGRES_DB:-ailp}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_SCHEMA_RETRIES: ${LLM_MAX_SCHEMA_RETRIES:-1}
      LLM_MAX_OUTPUT_TOKENS_INTERVIEW: ${LLM_MAX_OUTPUT_TOKENS_INTERVIEW:-800}
      LLM_MAX_OUTPUT_TOKENS_PROPOSAL: ${LLM_MAX_OUTPUT_TOKENS_PROPOSAL:-4500}
      LLM_MAX_OUTPUT_TOKENS_LESSON: ${LLM_MAX_OUTPUT_TOKENS_LESSON:-3000}
      LLM_MAX_OUTPUT_TOKENS_JUDGE: ${LLM_MAX_OUTPUT_TOKENS_JUDGE:-3000}
      LLM_PRICING_JSON: ${LLM_PRICING_JSON:-}
      GENERATION_MAX_TOKENS_PER_JOB: ${GENERATION_MAX_TOKENS_PER_JOB:-400000}
      GENERATION_MAX_COST_USD_PER_JOB: ${GENERATION_MAX_COST_USD_PER_JOB:-0}
      # P3.0 — Source Registry (cả 3 service dùng chung cấu hình)
      SOURCE_DISCOVERY_ADAPTER: ${SOURCE_DISCOVERY_ADAPTER:-curated}
      SOURCE_CURATED_CATALOG: ${SOURCE_CURATED_CATALOG:-}
      SOURCE_CONTEXT_ENABLED: ${SOURCE_CONTEXT_ENABLED:-true}
      SOURCE_CONTEXT_MAX_CHARS: ${SOURCE_CONTEXT_MAX_CHARS:-0}
      SOURCE_RESEARCH_ENABLED: ${SOURCE_RESEARCH_ENABLED:-false}
      SOURCE_RESEARCH_PROVIDER: ${SOURCE_RESEARCH_PROVIDER:-mock}
      SOURCE_RESEARCH_MAX_SOURCES: ${SOURCE_RESEARCH_MAX_SOURCES:-8}
      SOURCE_RESEARCH_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TIMEOUT_SECONDS:-15}
      SOURCE_RESEARCH_MAX_TOOL_CALLS: ${SOURCE_RESEARCH_MAX_TOOL_CALLS:-12}
      SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS:-5}
      SOURCE_RESEARCH_AUTO_LINK: ${SOURCE_RESEARCH_AUTO_LINK:-false}
      # P3.0 — AI Tutor (cả 3 service dùng chung cấu hình)
      TUTOR_ENABLED: ${TUTOR_ENABLED:-false}
      TUTOR_HISTORY_MAX_MESSAGES: ${TUTOR_HISTORY_MAX_MESSAGES:-12}
      TUTOR_MAX_QUESTION_CHARS: ${TUTOR_MAX_QUESTION_CHARS:-2000}
      TUTOR_CONTEXT_MAX_CHARS: ${TUTOR_CONTEXT_MAX_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS_TUTOR: ${LLM_MAX_OUTPUT_TOKENS_TUTOR:-900}
      TUTOR_STREAM_TIMEOUT_SECONDS: ${TUTOR_STREAM_TIMEOUT_SECONDS:-60}
      TUTOR_HEARTBEAT_SECONDS: ${TUTOR_HEARTBEAT_SECONDS:-15}
      TUTOR_MESSAGES_PER_DAY: ${TUTOR_MESSAGES_PER_DAY:-0}
      TUTOR_TOKENS_PER_DAY: ${TUTOR_TOKENS_PER_DAY:-0}
      TUTOR_MAX_CONCURRENT_STREAMS: ${TUTOR_MAX_CONCURRENT_STREAMS:-2}
      TUTOR_STALE_STREAM_SECONDS: ${TUTOR_STALE_STREAM_SECONDS:-180}
      TUTOR_CANCEL_POLL_SECONDS: ${TUTOR_CANCEL_POLL_SECONDS:-1}
      TUTOR_TOOLS_ENABLED: ${TUTOR_TOOLS_ENABLED:-false}
      TUTOR_TOOL_MAX_CALLS: ${TUTOR_TOOL_MAX_CALLS:-2}
      TUTOR_TOOL_TIMEOUT_SECONDS: ${TUTOR_TOOL_TIMEOUT_SECONDS:-3}
      TUTOR_TOOL_MAX_RESULT_CHARS: ${TUTOR_TOOL_MAX_RESULT_CHARS:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (copy .env.example)}
      ALLOW_DEMO_HEADER: ${ALLOW_DEMO_HEADER:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Có broker Redis → không chạy generation inline trong process API.
      GENERATION_ALLOW_INLINE_FALLBACK: "false"
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailp}:${POSTGRES_PASSWORD:-ailp_password}@db:5432/${POSTGRES_DB:-ailp}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_SCHEMA_RETRIES: ${LLM_MAX_SCHEMA_RETRIES:-1}
      LLM_MAX_OUTPUT_TOKENS_INTERVIEW: ${LLM_MAX_OUTPUT_TOKENS_INTERVIEW:-800}
      LLM_MAX_OUTPUT_TOKENS_PROPOSAL: ${LLM_MAX_OUTPUT_TOKENS_PROPOSAL:-4500}
      LLM_MAX_OUTPUT_TOKENS_LESSON: ${LLM_MAX_OUTPUT_TOKENS_LESSON:-3000}
      LLM_MAX_OUTPUT_TOKENS_JUDGE: ${LLM_MAX_OUTPUT_TOKENS_JUDGE:-3000}
      LLM_PRICING_JSON: ${LLM_PRICING_JSON:-}
      GENERATION_MAX_TOKENS_PER_JOB: ${GENERATION_MAX_TOKENS_PER_JOB:-400000}
      GENERATION_MAX_COST_USD_PER_JOB: ${GENERATION_MAX_COST_USD_PER_JOB:-0}
      # P3.0 — Source Registry (cả 3 service dùng chung cấu hình)
      SOURCE_DISCOVERY_ADAPTER: ${SOURCE_DISCOVERY_ADAPTER:-curated}
      SOURCE_CURATED_CATALOG: ${SOURCE_CURATED_CATALOG:-}
      SOURCE_CONTEXT_ENABLED: ${SOURCE_CONTEXT_ENABLED:-true}
      SOURCE_CONTEXT_MAX_CHARS: ${SOURCE_CONTEXT_MAX_CHARS:-0}
      SOURCE_RESEARCH_ENABLED: ${SOURCE_RESEARCH_ENABLED:-false}
      SOURCE_RESEARCH_PROVIDER: ${SOURCE_RESEARCH_PROVIDER:-mock}
      SOURCE_RESEARCH_MAX_SOURCES: ${SOURCE_RESEARCH_MAX_SOURCES:-8}
      SOURCE_RESEARCH_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TIMEOUT_SECONDS:-15}
      SOURCE_RESEARCH_MAX_TOOL_CALLS: ${SOURCE_RESEARCH_MAX_TOOL_CALLS:-12}
      SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS:-5}
      SOURCE_RESEARCH_AUTO_LINK: ${SOURCE_RESEARCH_AUTO_LINK:-false}
      # P3.0 — AI Tutor (cả 3 service dùng chung cấu hình)
      TUTOR_ENABLED: ${TUTOR_ENABLED:-false}
      TUTOR_HISTORY_MAX_MESSAGES: ${TUTOR_HISTORY_MAX_MESSAGES:-12}
      TUTOR_MAX_QUESTION_CHARS: ${TUTOR_MAX_QUESTION_CHARS:-2000}
      TUTOR_CONTEXT_MAX_CHARS: ${TUTOR_CONTEXT_MAX_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS_TUTOR: ${LLM_MAX_OUTPUT_TOKENS_TUTOR:-900}
      TUTOR_STREAM_TIMEOUT_SECONDS: ${TUTOR_STREAM_TIMEOUT_SECONDS:-60}
      TUTOR_HEARTBEAT_SECONDS: ${TUTOR_HEARTBEAT_SECONDS:-15}
      TUTOR_MESSAGES_PER_DAY: ${TUTOR_MESSAGES_PER_DAY:-0}
      TUTOR_TOKENS_PER_DAY: ${TUTOR_TOKENS_PER_DAY:-0}
      TUTOR_MAX_CONCURRENT_STREAMS: ${TUTOR_MAX_CONCURRENT_STREAMS:-2}
      TUTOR_STALE_STREAM_SECONDS: ${TUTOR_STALE_STREAM_SECONDS:-180}
      TUTOR_CANCEL_POLL_SECONDS: ${TUTOR_CANCEL_POLL_SECONDS:-1}
      TUTOR_TOOLS_ENABLED: ${TUTOR_TOOLS_ENABLED:-false}
      TUTOR_TOOL_MAX_CALLS: ${TUTOR_TOOL_MAX_CALLS:-2}
      TUTOR_TOOL_TIMEOUT_SECONDS: ${TUTOR_TOOL_TIMEOUT_SECONDS:-3}
      TUTOR_TOOL_MAX_RESULT_CHARS: ${TUTOR_TOOL_MAX_RESULT_CHARS:-3000}
      # Worker thật: không fallback chạy generation inline trong request API.
      GENERATION_ALLOW_INLINE_FALLBACK: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Reconciler/outbox: gửi lại job kẹt queued + requeue job có lease hết hạn.
  beat:
    build: ./backend
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailp}:${POSTGRES_PASSWORD:-ailp_password}@db:5432/${POSTGRES_DB:-ailp}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_SCHEMA_RETRIES: ${LLM_MAX_SCHEMA_RETRIES:-1}
      LLM_MAX_OUTPUT_TOKENS_INTERVIEW: ${LLM_MAX_OUTPUT_TOKENS_INTERVIEW:-800}
      LLM_MAX_OUTPUT_TOKENS_PROPOSAL: ${LLM_MAX_OUTPUT_TOKENS_PROPOSAL:-4500}
      LLM_MAX_OUTPUT_TOKENS_LESSON: ${LLM_MAX_OUTPUT_TOKENS_LESSON:-3000}
      LLM_MAX_OUTPUT_TOKENS_JUDGE: ${LLM_MAX_OUTPUT_TOKENS_JUDGE:-3000}
      LLM_PRICING_JSON: ${LLM_PRICING_JSON:-}
      GENERATION_MAX_TOKENS_PER_JOB: ${GENERATION_MAX_TOKENS_PER_JOB:-400000}
      GENERATION_MAX_COST_USD_PER_JOB: ${GENERATION_MAX_COST_USD_PER_JOB:-0}
      # P3.0 — Source Registry (cả 3 service dùng chung cấu hình)
      SOURCE_DISCOVERY_ADAPTER: ${SOURCE_DISCOVERY_ADAPTER:-curated}
      SOURCE_CURATED_CATALOG: ${SOURCE_CURATED_CATALOG:-}
      SOURCE_CONTEXT_ENABLED: ${SOURCE_CONTEXT_ENABLED:-true}
      SOURCE_CONTEXT_MAX_CHARS: ${SOURCE_CONTEXT_MAX_CHARS:-0}
      SOURCE_RESEARCH_ENABLED: ${SOURCE_RESEARCH_ENABLED:-false}
      SOURCE_RESEARCH_PROVIDER: ${SOURCE_RESEARCH_PROVIDER:-mock}
      SOURCE_RESEARCH_MAX_SOURCES: ${SOURCE_RESEARCH_MAX_SOURCES:-8}
      SOURCE_RESEARCH_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TIMEOUT_SECONDS:-15}
      SOURCE_RESEARCH_MAX_TOOL_CALLS: ${SOURCE_RESEARCH_MAX_TOOL_CALLS:-12}
      SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS: ${SOURCE_RESEARCH_TOOL_TIMEOUT_SECONDS:-5}
      SOURCE_RESEARCH_AUTO_LINK: ${SOURCE_RESEARCH_AUTO_LINK:-false}
      # P3.0 — AI Tutor (cả 3 service dùng chung cấu hình)
      TUTOR_ENABLED: ${TUTOR_ENABLED:-false}
      TUTOR_HISTORY_MAX_MESSAGES: ${TUTOR_HISTORY_MAX_MESSAGES:-12}
      TUTOR_MAX_QUESTION_CHARS: ${TUTOR_MAX_QUESTION_CHARS:-2000}
      TUTOR_CONTEXT_MAX_CHARS: ${TUTOR_CONTEXT_MAX_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS_TUTOR: ${LLM_MAX_OUTPUT_TOKENS_TUTOR:-900}
      TUTOR_STREAM_TIMEOUT_SECONDS: ${TUTOR_STREAM_TIMEOUT_SECONDS:-60}
      TUTOR_HEARTBEAT_SECONDS: ${TUTOR_HEARTBEAT_SECONDS:-15}
      TUTOR_MESSAGES_PER_DAY: ${TUTOR_MESSAGES_PER_DAY:-0}
      TUTOR_TOKENS_PER_DAY: ${TUTOR_TOKENS_PER_DAY:-0}
      TUTOR_MAX_CONCURRENT_STREAMS: ${TUTOR_MAX_CONCURRENT_STREAMS:-2}
      TUTOR_STALE_STREAM_SECONDS: ${TUTOR_STALE_STREAM_SECONDS:-180}
      TUTOR_CANCEL_POLL_SECONDS: ${TUTOR_CANCEL_POLL_SECONDS:-1}
      TUTOR_TOOLS_ENABLED: ${TUTOR_TOOLS_ENABLED:-false}
      TUTOR_TOOL_MAX_CALLS: ${TUTOR_TOOL_MAX_CALLS:-2}
      TUTOR_TOOL_TIMEOUT_SECONDS: ${TUTOR_TOOL_TIMEOUT_SECONDS:-3}
      TUTOR_TOOL_MAX_RESULT_CHARS: ${TUTOR_TOOL_MAX_RESULT_CHARS:-3000}
      GENERATION_ALLOW_INLINE_FALLBACK: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      - backend

volumes:
  pgdata:
