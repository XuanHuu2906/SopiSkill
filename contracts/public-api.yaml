        `userConfirmedRights` BẮT BUỘC và phải đúng `true`; đây là audit xác nhận

        quyền sử dụng, không phải checkbox trang trí. Chỉ một trong `url`/`arxivId`.'
  securitySchemes:
    AccessCookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly SameSite=Lax JWT access token issued by /v1/auth/login or /v1/auth/register.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional Bearer JWT fallback for non-browser CLI/tests.
    CsrfHeaderAuth:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token matching the non-HttpOnly `csrf_token` cookie on mutating requests.
