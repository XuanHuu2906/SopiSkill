  version: 1.0.0-wave4-baseline
  description: 'Frozen Phase 0 public HTTP/SSE API contract between frontend (Next.js 15) and core-api (Spring Boot 3.4+ cutover
    target, parity 100% with Wave 4 backend). Authentication uses HttpOnly JWT cookie (`access_token`) plus double-submit
    CSRF (`csrf_token` cookie matched against `X-CSRF-Token` header on mutating routes). All quiz grading is strictly server-authoritative:
    GET /v1/lessons/{lesson_id} never exposes answer keys.'
  x-contract-freeze:
    phase: phase-0
    baseline: wave-4
    compatibilityPolicy: strict-parity-through-phase-2-additive-only-from-phase-3
